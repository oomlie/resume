design:
  theme: ink
  page:
    size: us-letter
    top_margin: 0.3in
    bottom_margin: 0.3in
    left_margin: 0.45in
    right_margin: 0.45in
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(20, 24, 30)
    name: rgb(35, 52, 74)
    headline: rgb(35, 52, 74)
    connections: rgb(55, 70, 90)
    section_titles: rgb(35, 52, 74)
    links: rgb(35, 52, 74)
  typography:
    line_spacing: 0.5em
    font_size:
      body: 9.0pt
      name: 22pt
      headline: 9.5pt
      connections: 9pt
      section_titles: 1.15em
  header:
    alignment: left
    space_below_name: 0.35cm
    space_below_headline: 0.28cm
    space_below_connections: 0.35cm
